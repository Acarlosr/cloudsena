# Nginx na frente do CloudSena (opcional — para acessar de outra máquina na rede).
# Lembre de definir CLOUDSENA_API_TOKEN no .env antes de expor a API.

server {
    listen 80;
    server_name cloudsena.local;

    # Vídeos podem ser grandes; não bufferize nem limite tamanho.
    client_max_body_size 0;
    proxy_buffering off;

    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Streaming de vídeo depende de Range passar intacto.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
