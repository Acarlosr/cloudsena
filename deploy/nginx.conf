# Nginx como porta de entrada única do CloudSena na rede local.
#
# Topologia recomendada quando você acessa de outra máquina (ex.: navegador do Mac):
#
#   navegador  ──►  nginx :80  ──┬──►  Next.js  127.0.0.1:3000   (interface)
#                                └──►  FastAPI  127.0.0.1:8000   (API e vídeo)
#
# A API NÃO fica exposta na rede: no .env use CLOUDSENA_HOST=127.0.0.1.
# Assim não é preciso token — o que não escuta na rede não pode ser chamado dela.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cloudsena
#   sudo ln -s /etc/nginx/sites-available/cloudsena /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    # Vídeos são grandes; não bufferize nem limite tamanho.
    client_max_body_size 0;
    proxy_buffering off;

    # --- Opcional: senha para toda a interface ---
    # sudo apt install apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd seu_usuario
    # Descomente as duas linhas abaixo:
    # auth_basic "CloudSena";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Eventos em tempo real (SSE) vão direto ao FastAPI, sem passar pelo Next.
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Streaming de vídeo depende de Range chegar intacto ao backend.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
